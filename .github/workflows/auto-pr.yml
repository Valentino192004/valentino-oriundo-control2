name: Crear Pull Request MLOPS

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  crear-pull-request:
    if: contains(github.event.head_commit.message, 'MLOPS')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "PR automático - MLOPS" \
            --body "Pull Request creado automáticamente porque el mensaje del commit contiene la palabra MLOPS."
